name: Build FreeDeck IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcode apps:"
          ls /Applications | grep -i '^Xcode' || true
          # StikJIT.xcframework ships Swift 6.4 textual interfaces (built with
          # an Xcode 27 toolchain upstream). Prefer 27+ if present; otherwise
          # fall back to the newest available and let the build prove whether
          # its compiler can consume the interface.
          BEST=""
          BEST_V="0"
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            V=$("$app/Contents/Developer/usr/bin/xcodebuild" -version | awk '/Xcode/ {print $2}')
            MAJOR=${V%%.*}
            FIRST=$(printf '%s\n%s\n' "$BEST_V" "$V" | sort -V | tail -1)
            if [ "$FIRST" = "$V" ]; then
              BEST="$app"; BEST_V="$V"
            fi
          done
          if [ -z "$BEST" ]; then
            echo "::error::No Xcode found on this runner."
            exit 1
          fi
          MAJOR=${BEST_V%%.*}
          if [ "$MAJOR" -lt 27 ]; then
            echo "::warning::Newest Xcode is $BEST_V (no 27+ on this runner). Building anyway; StikJIT.xcframework needs a Swift 6.4-capable compiler to import."
          fi
          echo "Selecting $BEST (Xcode $BEST_V)"
          sudo xcode-select -s "$BEST/Contents/Developer"
          xcodebuild -version
          swift --version || true

      - name: Build and Archive
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -archivePath "$PWD/build/FreeDeck.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R "build/FreeDeck.xcarchive/Products/Applications/FreeDeck.app" build/Payload/
          cd build
          zip -qr FreeDeck.ipa Payload
          rm -rf Payload
          echo "IPA created successfully:"
          ls -lh FreeDeck.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeDeck.ipa
          path: build/FreeDeck.ipa

      - name: Attach IPA to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/FreeDeck.ipa
          generate_release_notes: true
