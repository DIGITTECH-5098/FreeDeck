# FreeDeck nginx configuration (production fast path).
#
# - /api/*          -> reverse proxy to the uvicorn FastAPI app
# - /stream/ENTRY/  -> served DIRECTLY from the storage root with byte-range
#                      support (Accept-Ranges + 206) via alias
# - /webport/ENTRY/ -> served DIRECTLY (HTML5/WASM builds, index.html default)
#
# The uvicorn app still implements the same routes with manual Range handling,
# so everything works without nginx too (uvicorn directly).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Extra MIME types the iOS client relies on
    types {
        application/wasm                 wasm;
        application/manifest+json        webmanifest;
        application/octet-stream         pak data;
        video/mp4                        mp4;
    }

    # Large IPA / zip uploads and downloads: generous timeouts
    client_max_body_size 8g;
    client_body_timeout  600s;
    send_timeout         600s;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;

    # Never gzip range-served binaries (breaks Content-Range math and wastes CPU)
    gzip off;

    upstream freedeck_web {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # --- API: reverse proxy to uvicorn -------------------------------
        location /api/ {
            proxy_pass         http://freedeck_web;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # --- Streaming: direct static serving with byte ranges ----------
        # nginx issues Accept-Ranges and answers Range requests (206) natively.
        location /stream/ {
            alias /freedeck_storage/;

            # Explicit range support (nginx enables ranges for static files
            # by default; these make the contract explicit and cacheable).
            max_ranges 1;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=3600" always;

            gzip off;
            sendfile           on;
            sendfile_max_chunk 1m;
        }

        # --- Web-port hosting: HTML5/WASM builds -------------------------
        # /webport/ENTRY/ maps to /freedeck_storage/webports/ENTRY/
        # (relative paths inside an entry resolve under webports/ENTRY/).
        location /webport/ {
            alias /freedeck_storage/webports/;

            max_ranges 1;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=3600" always;

            # .wasm must be application/wasm for WebAssembly.instantiateStreaming
            types {
                application/wasm              wasm;
                application/manifest+json     webmanifest;
                application/octet-stream      pak data;
                text/html                     html htm;
                application/javascript        js mjs;
                application/json              json;
                image/png                     png;
                image/jpeg                    jpg jpeg;
                image/webp                    webp;
                audio/mpeg                    mp3;
                audio/wav                     wav;
                video/mp4                     mp4;
            }
            default_type application/octet-stream;

            gzip off;
            sendfile           on;
            sendfile_max_chunk 1m;

            # Directory requests default to index.html
            index index.html;
        }

        # Optional: X-Accel-Redirect fast path alternative. To hand range
        # serving back to the app while keeping nginx in front for TLS and
        # rate limiting, delete the two static locations above and instead
        # have the app reply with:
        #   X-Accel-Redirect: /protected_stream/ENTRY/PATH
        # then use this internal location:
        #
        # location /protected_stream/ {
        #     internal;
        #     alias /freedeck_storage/;
        #     max_ranges 1;
        #     add_header Accept-Ranges bytes always;
        # }

        location = / {
            return 200 '{"service":"FreeDeck nginx"}';
            add_header Content-Type application/json;
        }
    }
}
